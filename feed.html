<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="/src/style.css" rel="stylesheet">

  <title>FuzzyGallery | Feed</title>

<body class="flex flex-col min-h-screen bg-[#F3EAD1]">
  <header class="sticky top-0 bg-[#A2EBC0]">…</header>
  <main class="flex-grow flex items-center justify-center p-4">
    <form id="registerForm" class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm space-y-4">
      <h2 class="text-2xl font-bold text-center text-[#5A3E28]">Sign Up</h2>
      <input id="name"     type="text"  placeholder="Name"  required …/>
      <input id="email"    type="email" placeholder="Email" required …/>
      <input id="password" type="password" placeholder="Password" required …/>
      <textarea id="bio" rows="3" placeholder="Short bio" …></textarea>
      <input id="avatar" type="url"   placeholder="Avatar URL (Unsplash)" …/>
      <input id="banner" type="url"   placeholder="Banner URL (Unsplash)" …/>
      <button type="submit" class="…">Create Account</button>
      <p class="text-center text-sm">
        Already have one?
        <a href="index.html" class="text-[#A8E0FF] hover:text-[#F9D774]">Log in</a>
      </p>
    </form>
  </main>
  <footer class="bg-[#A2EBC0] py-6">…</footer>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/auth.js"></script>
