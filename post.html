<!-- post.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FuzzyGallery | Post</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="flex flex-col min-h-screen bg-[#F3EAD1]">

  <header class="sticky top-0 bg-[#A2EBC0] z-10">
    <div class="h-24 md:h-40 flex items-center justify-between px-4">
      <a href="index.html" class="flex items-center space-x-4">
        <img src="/logo.png" class="h-24 md:h-32" alt="Logo"/>
        <span class="text-2xl md:text-3xl font-bold text-pink-500 md:text-[#5A3E28]">
          FuzzyGallery
        </span>
      </a>
      <button id="menuBtn" class="md:hidden p-2 text-pink-500 hover:text-pink-700" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <nav class="hidden md:flex space-x-6 text-[#5A3E28]">
        <a href="feed.html" class="hover:text-[#F9D774]">Feed</a>
        <a href="profile.html" class="hover:text-[#F9D774]">Profile</a>
        <button class="logoutBtn hover:text-[#F9D774]">Logout</button>
      </nav>
    </div>
    <nav id="mobileMenu" class="md:hidden hidden bg-[#A2EBC0] px-4 pb-4 space-y-2">
      <a href="feed.html" class="block text-pink-500 hover:text-pink-700">Feed</a>
      <a href="profile.html" class="block text-pink-500 hover:text-pink-700">Profile</a>
      <button class="logoutBtn block w-full text-left text-pink-500 hover:text-pink-700">Logout</button>
    </nav>
  </header>

  <main class="flex-grow p-4">
    <section class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6 my-8">
      <p><a href="feed.html" class="text-blue-600 hover:underline">&larr; Back to Feed</a></p>
      <div id="post-detail" class="prose mx-auto mt-6">
        <!-- injected by JS -->
      </div>
    </section>
  </main>

  <footer
    class="bg-[#A2EBC0] py-6 fixed bottom-0 left-0 w-full"
    style="font-family: Monaco, Menlo, Consolas, 'Liberation Mono', Courier, monospace;"
  >
    <div class="max-w-3xl mx-auto flex items-center justify-between px-4 text-[#5A3E28]">
      <div class="flex items-center gap-4">
        <span class="flex items-baseline gap-2">
          <span class="text-base">2025</span>
          <span class="text-base">&copy;</span>
          <span class="text-lg">Gøril Solheim</span>
        </span>
        <a href="https://github.com/gorsol89/JS2-CA-2025/tree/JS2"
           target="_blank"
           rel="noopener noreferrer"
           class="hover:text-[#F9D774]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 …"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/auth.js"></script>
  <script type="module" src="/src/js/post.js"></script>
</body>
</html>
