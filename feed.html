<!-- feed.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="/src/style.css" rel="stylesheet">
  <title>FuzzyGallery | Feed</title>
</head>
<body class="flex flex-col min-h-screen bg-[#F3EAD1]">
  <header class="sticky top-0 bg-[#A2EBC0] z-10">
  <div class="h-24 md:h-40 flex items-center justify-between px-4">
    <!-- Logo -->
    <a href="index.html" class="flex items-center space-x-4">
      <img src="/logo.png" class="h-24 md:h-32" alt="Logo"/>
      <span class="text-2xl md:text-3xl font-bold text-pink-500 md:text-[#5A3E28]">
        FuzzyGallery
      </span>
    </a>

    <!-- Hamburger button (mobile only) -->
    <button id="menuBtn"
            class="md:hidden p-2 text-pink-500 hover:text-pink-700"
            aria-label="Toggle menu">
      <svg xmlns="http://www.w3.org/2000/svg"
           class="w-8 h-8"
           fill="none" viewBox="0 0 24 24"
           stroke="currentColor">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Desktop nav -->
    <nav class="hidden md:flex space-x-6 text-[#5A3E28]">
      <a href="feed.html" class="hover:text-[#F9D774]">Feed</a>
      <a href="profile.html" class="hover:text-[#F9D774]">Profile</a>
      <button class="logoutBtn hover:text-[#F9D774]">Logout</button>
    </nav>
  </div>

  <!-- Mobile menu -->
  <nav id="mobileMenu"
       class="md:hidden hidden bg-[#A2EBC0] px-4 pb-4 space-y-2">
    <a href="feed.html"
       class="block text-pink-500 hover:text-pink-700">
      Feed
    </a>
    <a href="profile.html"
       class="block text-pink-500 hover:text-pink-700">
      Profile
    </a>
    <button class="logoutBtn block w-full text-left text-pink-500 hover:text-pink-700">
      Logout
    </button>
  </nav>
</header>

  <main class="flex-grow p-4">
    <div class="w-full max-w-3xl mx-auto space-y-6">
      
      <!-- Current User -->
      <div id="currentUser" class="flex items-center space-x-4 bg-white p-4 rounded-lg shadow-md">
        <img id="currentUserAvatar" class="w-10 h-10 rounded-full" src="" alt="Your avatar"/>
        <span id="currentUserName" class="font-semibold text-lg text-[#5A3E28]"></span>
      </div>

      <!-- Find Users -->
      <div class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-bold text-[#5A3E28]">Find Users</h2>
        <form id="searchForm" class="flex space-x-2">
          <input id="searchInput" type="text" placeholder="Username" required
                 class="flex-grow p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />
          <button type="submit"
                  class="bg-[#A8E0FF] hover:bg-[#F9D774] text-[#5A3E28] py-2 px-4 rounded-lg font-semibold">
            Search
          </button>
        </form>
        <div id="searchResults" class="space-y-2"></div>
      </div>

     <!-- New Post -->
<form id="postForm" class="bg-white p-6 rounded-lg shadow-md space-y-4">
  <h2 class="text-xl font-bold text-[#5A3E28]">New Post</h2>

  <input id="postTitle" type="text" placeholder="Title" required
         class="w-full p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />

  <textarea id="postBody" rows="4" placeholder="What's on your mind?" required
            class="w-full p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9D774]"></textarea>

  <input id="postImageUrl" type="url" placeholder="Image URL (optional)"
         class="w-full p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />

  <input id="postImageAlt" type="text" placeholder="Image Alt Text (optional)"
         class="w-full p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />

  <input id="postTags" type="text" placeholder="Tags (comma-separated)"
         class="w-full p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />

  <button type="submit"
          class="bg-[#F9A8B8] hover:bg-[#F9D774] text-[#5A3E28] py-2 px-4 rounded-lg font-semibold">
    Post
  </button>
</form>


<!-- Filter & Sort Panel -->
<div id="filterPanel" class="bg-white p-4 rounded-lg shadow-md mb-6 flex flex-wrap items-center gap-4">
  <!-- client-side keyword search -->
  <input id="filterSearch" type="text" placeholder="Search posts…"
         class="flex-grow min-w-[200px] p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />

  <!-- server-side sort -->
  <div class="flex items-center gap-2">
    <label for="sortSelect" class="text-[#5A3E28] font-medium">Sort:</label>
    <select id="sortSelect"
            class="p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]">
      <option value="created:desc">Date ↓</option>
      <option value="created:asc">Date ↑</option>
      <option value="title:asc">Title A–Z</option>
      <option value="title:desc">Title Z–A</option>
    </select>
  </div>

  <!-- server-side tag filter -->
  <div class="flex items-center gap-2">
    <input id="tagInput" type="text" placeholder="Tag"
           class="p-2 border border-[#5A3E28] rounded focus:ring-1 focus:ring-[#F9A8B8]" />
    <button id="tagBtn"
            class="bg-[#A8E0FF] hover:bg-[#F9D774] text-[#5A3E28] py-2 px-4 rounded-lg font-semibold">
      Filter Tag
    </button>
  </div>
</div>


      <!-- Feed Container -->
      <div id="feedContainer" class="space-y-4"></div>
    </div>
     <img
    src="/catinbox.png"
    alt="Cute illustration of a cat in a cardboard box"
    class="fixed bottom-4 right-4 h-34 w-auto z-10 pointer-events-none"
  />
  </main>

  <footer
  class="bg-[#A2EBC0] py-6 fixed bottom-0 left-0 w-full"
  style="font-family: Monaco, Menlo, Consolas, 'Liberation Mono', Courier, monospace;"
>
  <div class="max-w-3xl mx-auto flex items-center justify-between px-4 text-[#5A3E28]">
    <!-- Left side: © 2025 Gøril Solheim + GitHub -->
    <div class="flex items-center gap-4">
      <span class="flex items-baseline gap-2">
        <span class="text-base">2025</span>
        <span class="text-base">&copy;</span>
        <span class="text-lg">Gøril Solheim</span>
      </span>
      <a href="https://github.com/gorsol89/JS2-CA-2025/tree/JS2"
         target="_blank"
         rel="noopener noreferrer"
         class="hover:text-[#F9D774]">

            1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.807 1.305 3.492.998
            .108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.332-5.467-5.93
            0-1.31.467-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176

            c1.02.005 2.045.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23
            .645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22

      </a>
    </div>


</footer>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/feed.js"></script>
</body>
</html>
