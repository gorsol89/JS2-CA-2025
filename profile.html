<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="/src/style.css" rel="stylesheet">
  <title>FuzzyGallery | Profile</title>
</head>
<body class="flex flex-col min-h-screen bg-[#F3EAD1]">
  <header class="sticky top-0 bg-[#A2EBC0] z-10">
    <div class="h-40 flex items-center justify-between px-4">
      <!-- Logo -->
      <a href="index.html" class="flex items-center space-x-4">
        <img src="/logo.png" class="h-32" alt="Logo"/>
        <span class="text-3xl font-bold text-[#5A3E28]">FuzzyGallery</span>
      </a>
  
      <!-- Hamburger button (small screens) -->
      <button id="menuBtn"
              class="md:hidden p-2 text-[#5A3E28]"
              aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-8 h-8"
             fill="none" viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
  
      <!-- Desktop nav -->
      <nav class="hidden md:flex space-x-6">
        <a href="feed.html"
           class="text-[#5A3E28] hover:text-[#F9D774]">
          Feed
        </a>
        <a href="profile.html"
           class="text-[#5A3E28] hover:text-[#F9D774]">
          Profile
        </a>
        <button class="logoutBtn text-[#5A3E28] hover:text-[#F9D774]">
          Logout
        </button>
      </nav>
    </div>
  
    <!-- Mobile menu -->
    <nav id="mobileMenu"
         class="md:hidden hidden bg-[#A2EBC0] px-4 pb-4 space-y-2">
      <a href="feed.html"
         class="block text-[#5A3E28] hover:text-[#F9D774]">
        Feed
      </a>
      <a href="profile.html"
         class="block text-[#5A3E28] hover:text-[#F9D774]">
        Profile
      </a>
      <button class="logoutBtn block text-left w-full text-[#5A3E28] hover:text-[#F9D774]">
        Logout
      </button>
    </nav>
  </header>

  <main class="flex-grow p-4 max-w-3xl mx-auto space-y-6">
    <section id="profileInfo" class="bg-white rounded-lg shadow-md overflow-hidden"></section>
    <section id="profilePosts"></section>
  </main>

  <footer class="bg-[#A2EBC0] py-6">…</footer>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/profile.js"></script>
</body>
</html>
